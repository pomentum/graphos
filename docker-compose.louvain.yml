# Louvain community detection on an image built without it (the published one),
# with no rebuild and nothing mounted:
#
#   docker compose -f docker-compose.graphos.yml -f docker-compose.louvain.yml up -d
#
# graphos-api installs python-igraph from PyPI into its own container on its first
# start, then starts graphos as usual; graphos finds it at startup, so
# GET /v1/info reports "louvain": true and POST /v1/{tenant}/recompute-communities
# works. Restarts reuse the install; a recreated container installs it again (it
# needs PyPI then). Without this file nothing changes, and recompute answers 501.
#
# python-igraph is GPL-2.0-or-later. This file downloads it on your machine; the
# graphos images do not contain it. If you redistribute a container or image with
# it inside, that distribution must comply with the GPL (see THIRD_PARTY_NOTICES.md).

services:
  graphos-api:
    environment:
      # Keep within the `louvain` extra of services/graphos/pyproject.toml.
      GRAPHOS_IGRAPH: "python-igraph>=0.11,<1.0"
    entrypoint:
      - sh
      - -ec
      - |
        extras=/tmp/graphos-extras
        if [ "$$(cat "$$extras/.installed" 2>/dev/null)" != "$$GRAPHOS_IGRAPH" ]; then
          echo "graphos-api: installing $$GRAPHOS_IGRAPH for Louvain"
          rm -rf "$$extras"
          HOME=/tmp pip install --quiet --no-cache-dir --disable-pip-version-check \
            --target "$$extras" "$$GRAPHOS_IGRAPH"
          echo "$$GRAPHOS_IGRAPH" > "$$extras/.installed"
        fi
        export PYTHONPATH="/app:$$extras"
        exec python -m graphos
    healthcheck:
      # The first start downloads python-igraph before graphos listens.
      start_period: 120s
