[project]
name = "graphos"
version = "0.8.2"
description = "Multi-tenant graph service backed by PostgreSQL + Apache AGE, exposed over HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "asyncpg>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.4,<25.0",
    "prometheus-client>=0.21,<1.0",
    # Graph metrics (PageRank, degree, components, betweenness): Apache-2.0.
    "rustworkx>=0.18,<0.19",
    "numpy>=2.0,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    # Talking to the identity provider (discovery, keys, code exchange).
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Louvain community detection runs in-process via the C core of igraph.
# Optional because python-igraph is GPL-2.0-or-later and graphos is
# Apache-2.0: without it, POST /v1/{tenant}/recompute-communities answers 501.
# Pinned to 0.11.x: community ids are made deterministic by seeding igraph's
# random number generator, which is the behaviour tested on this series.
louvain = [
    "python-igraph>=0.11,<1.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.16,<0.17",                     # pinned: new ruff releases add rules
    "mypy>=1.13,<2.0",
    "httpx>=0.27,<1.0",                      # required by fastapi.testclient
]

[project.scripts]
graphos = "graphos.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: SPDX license + license-files (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL"]
# Size metrics, not defects: the endpoint handlers and the Louvain pipeline
# are long by design (one SQL round-trip per step, kept linear for
# readability) and splitting them to satisfy a counter would hide the flow.
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert against literal counts / values without naming them as
# constants — readability beats DRY for one-shot expected values — and import
# inside a test so monkeypatching happens before the module is bound.
"tests/**" = ["PLR2004", "PLC0415"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: test requires a live graphos-db (GRAPHOS_TEST_DSN must be set)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
