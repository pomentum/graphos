# graphos CI — fast unit tests on every push, integration on PR/main only.
name: graphos-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ── Fast path: lint + unit tests (no DB) ────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (service)
        run: pip install -e "services/graphos[dev]"

      - name: Lint (service)
        run: ruff check services/graphos/src services/graphos/tests

      - name: Types (service)
        working-directory: services/graphos
        run: mypy

      # In parallel (pytest-xdist), with coverage: its table goes to the run's summary page.
      - name: Unit tests (no DB)
        run: >-
          pytest -m "not db" -n auto services/graphos/tests
          --cov=graphos --cov-report=xml:coverage-service.xml --cov-report=html:htmlcov/service

      - name: Coverage summary (service)
        if: always()
        run: python3 tools/ci/coverage_summary.py --title "Service (unit tests, no DB)" coverage-service.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Install (client)
        run: pip install -e "clients/python[dev]"

      - name: Lint (client)
        run: ruff check clients/python/src clients/python/tests clients/python/examples

      # Serial: a few deliberately slow tests dominate, which workers do not shorten.
      - name: Client tests
        run: >-
          pytest clients/python/tests
          --cov=graphos_client --cov-report=xml:coverage-client.xml --cov-report=html:htmlcov/client

      - name: Coverage summary (client)
        if: always()
        run: python3 tools/ci/coverage_summary.py --title "Python client" coverage-client.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage reports (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: htmlcov/
          if-no-files-found: ignore

  # ── Web UI: format, types, tests, production build ──────────────────────
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graphos-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/graphos-ui/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Format and types
        run: npm run lint

      - name: Tests
        run: npm test

      # Report only: coverage slows the jsdom tests, so a test past its time here does not
      # fail the run (the step above is the gate); the summary is written either way.
      - name: Coverage
        continue-on-error: true
        run: npx vitest run --coverage --testTimeout=30000

      - name: Coverage summary (web UI)
        if: always()
        run: python3 ../../tools/ci/coverage_summary.py --title "Web UI" coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui
          path: services/graphos-ui/coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  # ── Repo consistency: licence copies + generated diagrams ───────────────
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Licence files in each package match the repository root
        run: |
          for d in services/graphos services/graphos-ui clients/python; do
            for f in LICENSE NOTICE THIRD_PARTY_NOTICES.md; do
              cmp "$f" "$d/$f" || { echo "::error::$d/$f differs from ./$f"; exit 1; }
            done
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Diagrams are up to date
        run: node tools/docs/diagrams.mjs --check

      - name: One version across server, client and UI
        run: node tools/release/version.mjs --check

      - name: The API documentation files are the pinned releases
        run: python3 tools/docs/api_docs_assets.py --check

  # ── Integration: brings up compose, runs @db-marked tests ───────────────
  # Heavier; runs only on PRs and pushes to main. Tear-down is in the
  # script's exit trap, so a failure mid-run still cleans up.
  # One graphos build, against the database it supports: the compose's
  # (PostgreSQL 18, AGE 1.8; ADR-0007). The matrix keeps the check's name.
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: pg18-age1.8
            image: ""
    name: integration (${{ matrix.db }})
    steps:
      - uses: actions/checkout@v4

      # The tests run in a container with services/graphos mounted at /work, so the
      # coverage report written there is on the runner afterwards.
      - name: Run DB-gated tests against compose stack
        env:
          DB_IMAGE: ${{ matrix.image }}
        run: >-
          bash scripts/run-db-tests.sh --down-volumes ${DB_IMAGE:+--db-image "$DB_IMAGE"}
          -m db --cov=graphos --cov-report=xml:/work/coverage-db.xml
          --cov-report=html:/work/htmlcov/db

      - name: Coverage summary (service, DB tests)
        if: always()
        run: python3 tools/ci/coverage_summary.py --title "Service (DB tests)" services/graphos/coverage-db.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-db-${{ matrix.db }}
          path: services/graphos/htmlcov/db/
          if-no-files-found: ignore
