# Publish the whitepaper page to Vercel, and nothing else from this repository.
#
# ── How ───────────────────────────────────────────────────────────────────────
#
# Vercel never reads the repository. This job checks the page here and hands
# Vercel one file as a finished deployment (`--prebuilt`): Vercel runs no build
# of its own, and the project's build settings play no part.
#
# ── What it checks before publishing ──────────────────────────────────────────
#
# The page embeds its diagrams, generated by tools/docs/diagrams.mjs. `--check`
# fails if the committed SVGs or the figures inside the page are not what the
# source draws, so a page with stale diagrams is refused rather than published.
#
# ── What it publishes ─────────────────────────────────────────────────────────
#
# docs/whitepaper.html, as index.html, to the Vercel project `graphos` in the
# team `pomentum`, as a production deployment. The project is created on the
# first run if it does not exist. Only that file is uploaded: the page is
# self-contained, so nothing else leaves the repository.
#
# ── What it needs ─────────────────────────────────────────────────────────────
#
# One repository secret, VERCEL_POMENTUM_GRAPHOS: a Vercel token with access to
# the `pomentum` team. The job refuses with a message naming it when it is
# missing, rather than failing somewhere less clear.
#
# ── Making it public ──────────────────────────────────────────────────────────
#
# Team URLs (graphos-pomentum.vercel.app) sit behind Vercel Authentication.
# For a public page, add a domain to the project (the specmake page uses
# spec-make.vercel.app) or turn off Vercel Authentication for this project.

name: whitepaper

on:
  push:
    branches: [main]
    paths:
      - docs/whitepaper.html
      - docs/images/**
      - tools/docs/**
      - .github/workflows/whitepaper.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whitepaper
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The diagrams in the page match their source
        run: node tools/docs/diagrams.mjs --check

      - name: Only the page, as a finished deployment
        run: |
          mkdir -p site/.vercel/output/static
          cp docs/whitepaper.html site/.vercel/output/static/index.html
          echo '{"version":3}' > site/.vercel/output/config.json

      - name: Deploy to Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_POMENTUM_GRAPHOS }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The repository secret VERCEL_POMENTUM_GRAPHOS is not set. Create a Vercel token with access to the pomentum team and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Create the project on the first run; later runs find it already there.
          npx --yes vercel@62.1.0 project add graphos --scope pomentum --token "$VERCEL_TOKEN" || true
          npx --yes vercel@62.1.0 link --yes --project graphos --scope pomentum --token "$VERCEL_TOKEN"
          npx --yes vercel@62.1.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
