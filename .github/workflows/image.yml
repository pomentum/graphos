# graphos-api and graphos-ui container images.
#
# build     every PR and push: builds both API variants (no push) and smoke-tests them.
# build-ui  every PR and push: builds the UI image (no push) and smoke-tests it.
#           Read-only token, so both are safe on pull requests from forks.
# publish   main and version tags X.Y.Z only (push or manual run): builds the default API
#           variant and the UI for each platform on a runner of that platform (amd64 on
#           ubuntu-latest, arm64 on ubuntu-24.04-arm: no emulation) and pushes each by digest.
# merge     joins the two digests of each image into one multi-platform image under its tags:
#           ghcr.io/<owner>/graphos-api and ghcr.io/<owner>/graphos-ui.
#           Only publish and merge get `packages: write`.
#
# A version tag (e.g. 0.1.0) releases the images. It must equal the version in
# services/graphos/pyproject.toml, clients/python/pyproject.toml and
# services/graphos-ui/package.json. The client is
# published to PyPI separately, by hand (see client-release.yml).
#
# Variants:
#   default  permissive dependencies only; POST .../recompute-communities answers 501
#   louvain  adds python-igraph (GPL-2.0-or-later) for Louvain community detection.
#            Built and tested, not published: publishing it distributes GPL code.
name: graphos-image

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            extras: ""
          - variant: louvain
            extras: louvain
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.variant }}, amd64)
        uses: docker/build-push-action@v6
        with:
          context: services/graphos
          build-args: |
            GRAPHOS_EXTRAS=${{ matrix.extras }}
          load: true
          tags: graphos-api:ci
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python graphos-api:ci -c "
          import graphos.louvain as l, graphos.app
          expected = '${{ matrix.extras }}' == 'louvain'
          assert l.LOUVAIN_AVAILABLE is expected, (l.LOUVAIN_AVAILABLE, expected)
          print('ok: louvain available =', l.LOUVAIN_AVAILABLE)
          "
          docker run --rm --entrypoint ls graphos-api:ci /usr/share/licenses/graphos

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (ui, amd64)
        uses: docker/build-push-action@v6
        with:
          context: services/graphos-ui
          load: true
          tags: graphos-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Smoke test
        # Runs the UI alone: it must start without graphos-api (looked up per request).
        run: |
          docker run -d --name ui -p 8081:8080 graphos-ui:ci
          trap 'echo "::group::ui logs"; docker logs ui; echo "::endgroup::"' EXIT
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8081/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8081/healthz
          curl -fs http://127.0.0.1:8081/ | grep -q '<div id="root">'
          curl -fsI http://127.0.0.1:8081/ | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/healthz)" = 502
          docker exec ui ls /usr/share/licenses/graphos-ui

  publish:
    needs: [build, build-ui]
    # Only main and version tags publish: not pull requests, not manual runs on other branches.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, ui]
        platform: [amd64, arm64]
        include:
          - image: api
            context: services/graphos
            cache: default
            description: Multi-tenant graph service on PostgreSQL + Apache AGE
          - image: ui
            context: services/graphos-ui
            cache: ui
            description: Web UI for graphos
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the service, UI and client versions
        if: startsWith(github.ref, 'refs/tags/')
        # Every place the version lives, and a changelog entry for it (tools/release/version.mjs).
        run: node tools/release/version.mjs --check "${GITHUB_REF_NAME}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/graphos-${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=graphos-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push by digest (${{ matrix.image }}, ${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 reuses the build job's cache; arm64 keeps one of its own.
          cache-from: type=gha,scope=${{ matrix.platform == 'amd64' && matrix.cache || format('{0}-arm64', matrix.cache) }}
          cache-to: ${{ matrix.platform == 'arm64' && format('type=gha,mode=max,scope={0}-arm64', matrix.cache) || '' }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/graphos-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, ui]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/graphos-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Multi-platform image under its tags (amd64 + arm64)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/graphos-${{ matrix.image }}
        run: |
          test "$(ls | wc -l)" = 2
          docker buildx imagetools create             $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")             $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/graphos-${{ matrix.image }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}'             | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") and index("arm64"))'
