# Publish graphos-client to PyPI when a version tag X.Y.Z (e.g. 0.1.0) is pushed.
# The tag must equal the version in clients/python/pyproject.toml.
#
# Uses PyPI trusted publishing (OIDC): no API token is stored in GitHub.
# One-time setup on pypi.org: add a (pending) trusted publisher for project
# "graphos-client" with owner/repository of this repo, workflow
# "client-release.yml" and environment "pypi".
name: graphos-client-release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the package version
        working-directory: clients/python
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Test
        working-directory: clients/python
        run: |
          pip install -e ".[dev]"
          ruff check src tests examples
          pytest tests

      - name: Build and check
        working-directory: clients/python
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
