# Publish graphos-client to PyPI. Manual only: pushing a version tag does NOT
# publish the client (it releases the container image, see image.yml).
#
# To publish: Actions -> graphos-client-release -> Run workflow, and pick the
# version tag (e.g. 0.1.0) as the ref. The tag must equal the version in both
# clients/python/pyproject.toml and services/graphos/pyproject.toml.
#
# Uses PyPI trusted publishing (OIDC): no API token is stored in GitHub.
# One-time setup on pypi.org: add a (pending) trusted publisher for project
# "graphos-client" with owner/repository of this repo, workflow
# "client-release.yml" and environment "pypi".
name: graphos-client-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the service and client versions
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::run this workflow from a version tag (e.g. 0.1.0), not ${GITHUB_REF_NAME}"
            exit 1
          fi
          for f in services/graphos/pyproject.toml clients/python/pyproject.toml; do
            version="$(python3 -c "import sys,tomllib;print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$f")"
            if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in $f"
              exit 1
            fi
          done

      - name: Test
        working-directory: clients/python
        run: |
          pip install -e ".[dev]"
          ruff check src tests examples
          pytest tests

      - name: Build and check
        working-directory: clients/python
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
