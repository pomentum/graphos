# Build the graphos website and publish it on GitHub Pages:
# https://pomentum.github.io/graphos/
#
# ── How ───────────────────────────────────────────────────────────────────────
#
# website/assemble.py copies the repository's own docs (docs/*.md, the
# component READMEs, the changelog, docs/images/, the whitepaper) into
# website/.build/docs and fixes their links; MkDocs with the Material theme
# renders them, with the landing page filled from the README. Nothing on the
# site is written twice: change the docs, and the next push to main publishes
# them.
#
# ── What it checks ────────────────────────────────────────────────────────────
#
# `mkdocs build --strict` fails on a broken link or a missing anchor between
# the pages, so a page that would send readers nowhere is refused. Pull
# requests that touch the site build it the same way and publish nothing.
#
# ── What it needs ─────────────────────────────────────────────────────────────
#
# Settings → Pages → Build and deployment → Source: GitHub Actions. Nothing
# else: the deploy job uses the workflow's own OIDC token, no secret.

name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - clients/python/README.md
      - services/graphos-ui/README.md
      - services/graphos/pyproject.toml
      - website/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - clients/python/README.md
      - services/graphos-ui/README.md
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install the site's build, pinned
        run: pip install -r website/requirements.txt

      - name: Assemble the docs and build the site
        run: bash website/build.sh python

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/.build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
