# Build the graphos website and publish it on GitHub Pages:
# https://pomentum.github.io/graphos/
#
# ── How ───────────────────────────────────────────────────────────────────────
#
# The site is one page, website/index.html, and the whitepaper beside it at
# whitepaper/. website/build.py fills the page from what the repository
# already has (the whitepaper's stylesheet, scripts and summary; the README's
# features, screenshots, quickstart and docs table; the version), copies the
# whitepaper and docs/images/, and needs nothing but Python's standard library.
#
# ── What it checks ────────────────────────────────────────────────────────────
#
# The build fails when a slot of the page is left unfilled, or when the page
# links to a picture or page the site does not have. Pull requests that touch
# the site build it the same way and publish nothing.
#
# ── What it needs ─────────────────────────────────────────────────────────────
#
# Settings → Pages → Build and deployment → Source: GitHub Actions. Nothing
# else: the deploy job uses the workflow's own OIDC token, no secret.

name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - clients/python/README.md
      - services/graphos-ui/README.md
      - services/graphos/pyproject.toml
      - website/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - clients/python/README.md
      - services/graphos-ui/README.md
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the site
        run: bash website/build.sh python

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/.build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
