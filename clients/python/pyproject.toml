[project]
name = "graphos-client"
version = "0.12.0"
description = "Async HTTP client for the graphos graph service."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["graph", "graph-database", "apache-age", "postgresql", "cypher", "client", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/pomentum/graphos"
Documentation = "https://github.com/pomentum/graphos/tree/main/clients/python"
Source = "https://github.com/pomentum/graphos"
Issues = "https://github.com/pomentum/graphos/issues"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: SPDX license + license-files (PEP 639)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphos_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
